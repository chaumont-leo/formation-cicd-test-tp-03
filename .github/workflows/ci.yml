name: Java CI

on:
  push:
    branches:
      - lchaumont

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Create Jar
        run: mvn -q clean package
      - name: Start Jar and add logs
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo $! > save_pid.txt
      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8085/health > /dev/null; then
              echo "API is up!"
              exit 0
            fi
            echo "Waiting API..."
            sleep 2
          done
          echo "API not ready"
          tail -n 200 app.log || true
          exit 1
      - name: Prepare API test reports directory
        run: mkdir -p api-test-reports
      - name: Run API tests (Hurl via Docker)
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}:/work \
            ghcr.io/orange-opensource/hurl:latest \
            --test /work/src/test/java/api \
            --report-junit /work/api-test-reports/junit.xml \
            --report-html /work/api-test-reports/report.html \
            --report-json /work/api-test-reports/report.json \
      - name: Stop Application
        if: always()
        run: |
          if [ -f save_pid.txt ]; then
            kill $(cat save_pid.txt) && echo "Application arrêtée proprement." || echo "Processus déjà mort."
          fi
      - name: Upload Hurl Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurl-reports
          path: api-test-reports/
  security-tests:
    runs-on: ubuntu-latest
    needs: [api-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Create Jar
        run: mvn -q clean package
      - name: Start Jar and add logs
        run: |
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo $! > save_pid.txt
      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8085/health > /dev/null; then
              echo "API is up!"
              exit 0
            fi
            echo "Waiting API..."
            sleep 2
          done
          echo "API not ready"
          tail -n 200 app.log || true
          exit 1
      - name: Prepare API test reports directory
        run: |
          mkdir -p zap-test-reports
          chmod -R 777 zap-test-reports
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8085/'
          cmd_options: '-r zap-test-reports/zap_report.html'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false
      - name: Stop Application
        if: always()
        run: |
          if [ -f save_pid.txt ]; then
            kill $(cat save_pid.txt) && echo "Application arrêtée proprement." || echo "Processus déjà mort."
          fi
      - name: Upload Zap Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-test-reports/